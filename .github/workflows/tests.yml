name: Run Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '7.0.x'

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'
        cache-dependency-path: file-sharing-client/package-lock.json

    - name: Restore .NET dependencies
      run: dotnet restore

    - name: Build .NET project
      run: dotnet build --no-restore --configuration Release

    - name: Create appsettings.json for tests
      run: |
        echo '{
          "bucketName": "test-bucket",
          "keyFilename": "test-key.json",
          "connectionString": "Host=localhost;Database=testdb;Username=test;Password=test",
          "JWTKEY": "test-jwt-key-for-testing-purposes-only"
        }' > FileSharer/appsettings.json

    - name: Test .NET backend
      run: dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"

    - name: Install frontend dependencies
      run: cd file-sharing-client && npm ci

    - name: Test frontend
      run: cd file-sharing-client && npm test -- --coverage --watchAll=false --ci

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage/lcov.info,./FileSharer.Tests/TestResults/coverage.cobertura.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
