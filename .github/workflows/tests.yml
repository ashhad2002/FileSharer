name: Run Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '7.0.x'

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'
        cache-dependency-path: file-sharing-client/package-lock.json

    - name: Create settings files
      run: |
        echo '{
          "bucketName": "test-bucket",
          "keyFilename": "test-key.json",
          "connectionString": "Host=localhost;Database=testdb;Username=test;Password=test",
          "JWTKEY": "test-jwt-key-for-testing-purposes-only-must-be-long-enough"
        }' > appsettings.json
        
        echo '{
          "bucketName": "test-bucket",
          "keyFilename": "test-key.json",
          "connectionString": "Host=localhost;Database=testdb;Username=test;Password=test",
          "JWTKEY": "test-jwt-key-for-testing-purposes-only-must-be-long-enough"
        }' > FileSharer.Tests/appsettings.Test.json

    - name: Restore .NET dependencies
      run: dotnet restore

    - name: Build .NET project
      run: dotnet build --no-restore --configuration Release
      run: |
        echo '{
          "bucketName": "test-bucket",
          "keyFilename": "test-key.json",
          "connectionString": "Host=localhost;Database=testdb;Username=test;Password=test",
          "JWTKEY": "test-jwt-key-for-testing-purposes-only-must-be-long-enough"
        }' > FileSharer.Tests/appsettings.Test.json
        
        echo '{
          "bucketName": "test-bucket",
          "keyFilename": "test-key.json",
          "connectionString": "Host=localhost;Database=testdb;Username=test;Password=test",
          "JWTKEY": "test-jwt-key-for-testing-purposes-only-must-be-long-enough"
        }' > appsettings.json

    - name: Create dummy service account key
      run: |
        cat > FileSharer.Tests/test-key.json << EOF
        {
          "type": "service_account",
          "project_id": "test-project",
          "private_key_id": "fake-key-id",
          "private_key": "-----BEGIN PRIVATE KEY-----\\n-----END PRIVATE KEY-----\n",
          "client_email": "test-service-account@test-project.iam.gserviceaccount.com",
          "client_id": "123456789",
          "auth_uri": "https://accounts.google.com/o/oauth2/auth",
          "token_uri": "https://oauth2.googleapis.com/token",
          "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
          "client_x509_cert_url": "https://www.googleapis.com/robot/v1/metadata/x509/test-service-account%40test-project.iam.gserviceaccount.com"
        }
        EOF
        
    - name: Test .NET backend
      run: dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"

    - name: Install frontend dependencies
      run: cd file-sharing-client && npm ci

    - name: Test frontend
      run: cd file-sharing-client && npm test -- --coverage --watchAll=false --ci

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage/lcov.info,./FileSharer.Tests/TestResults/coverage.cobertura.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
